# Local development database only. The api and web run on your machine with `pnpm dev`.
# Start it:  docker compose -f deploy/compose.dev.yaml up -d
# Matches DATABASE_URL in the root .env.example.

name: ssdashboard-dev

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ssdashboard
      POSTGRES_USER: ssdashboard
      POSTGRES_PASSWORD: ssdashboard
    ports:
      # Host port 5433, so it never collides with a PostgreSQL already installed on 5432.
      - "5433:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql

volumes:
  postgres-dev-data:
