# Garage (S3 compatible object store) for local development only. Mounted by deploy/compose.dev.yaml.
# The RPC secret comes from the GARAGE_RPC_SECRET environment variable, not from this file.
# One node, so no replication. A real install sets a higher replication factor only with more nodes.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"

replication_factor = 1

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
