# One client install. Versioned with the release; ships alongside it.
# Run from this folder:  docker compose --env-file .env up -d
# Client installs pin SSD_VERSION to an exact release (never `latest`).

name: ssdashboard-${CLIENT_ID:?set CLIENT_ID in .env}

# No service loads the whole .env: each gets only the variables it needs, so the owner
# password (POSTGRES_PASSWORD) reaches postgres and migrate only (spec 0002, AC-2).
x-app: &app
  image: ${SSD_REGISTRY:-ghcr.io/adiyab25}/ssdashboard-app:${SSD_VERSION:?set SSD_VERSION in .env}
  restart: unless-stopped

# DATABASE_URL is the application role: it can never update or delete stock movements.
x-app-env: &app-env
  DATABASE_URL: postgres://${APP_DB_ROLE:-ssdashboard_app}:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@postgres:5432/ssdashboard
  APP_VERSION: ${SSD_VERSION}
  EXTENSIONS: ${EXTENSIONS:-}

# Auth and mail settings (spec 0005). The api queues emails and the worker sends them, and both
# validate the same environment at startup, so both get all of these.
x-auth-env: &auth-env
  PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
  # The staff cookie Path (api) and the prefix of email links (worker), spec 0005 AC-31.
  STAFF_BASE_PATH: ${STAFF_BASE_PATH:-}
  CLIENT_DISPLAY_NAME: ${CLIENT_DISPLAY_NAME:-}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  MAIL_DRIVER: ${MAIL_DRIVER:-none}
  MAIL_FROM: ${MAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}

# The key that seals each connection's Shopify credentials (spec 0015, AC-2), read by the api and
# the worker only, never migrate. The previous key is set only during a rotation.
x-connector-env: &connector-env
  CONNECTOR_SECRET_KEY: ${CONNECTOR_SECRET_KEY:?set CONNECTOR_SECRET_KEY in .env}
  CONNECTOR_SECRET_KEY_PREVIOUS: ${CONNECTOR_SECRET_KEY_PREVIOUS:-}

services:
  postgres:
    # One pinned major per release. PostgreSQL 18 keeps its data under /var/lib/postgresql/18.
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ssdashboard
      POSTGRES_USER: ssdashboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssdashboard -d ssdashboard"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

  # One off: applies migrations and exits. The api starts only after it succeeds.
  # It validates only its own variables (loadMigrateEnv): never add the auth or mail settings here.
  # apps/api/test/compose-env.spec.ts checks every app service's list against its entry point.
  migrate:
    <<: *app
    command: ["node", "dist/migrate.js"]
    environment:
      <<: *app-env
      # Only migrate connects as the owner. It also sets the application role's login password.
      MIGRATION_DATABASE_URL: postgres://ssdashboard:${POSTGRES_PASSWORD}@postgres:5432/ssdashboard
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      # Stored on the database's first run and checked on every run (spec 0002, A2): the tenant id
      # (unset: generated) and the application role's name. A different value stops migrate.
      TENANT_ID: ${TENANT_ID:-}
      APP_DB_ROLE: ${APP_DB_ROLE:-ssdashboard_app}
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 256m
    restart: "no"

  api:
    <<: *app
    environment:
      <<: [*app-env, *auth-env, *connector-env]
      # Read by the api only: /api/auth/* answers 404 for this host (spec 0005, AC-30).
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:-}
      # The signed license file's path inside the container (spec 0009); empty: none_configured.
      LICENSE_FILE: ${LICENSE_FILE:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  # Background jobs (pg-boss): the nightly ledger reconciliation, the email queue, and the daily license check.
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    environment:
      <<: [*app-env, *auth-env, *connector-env]
      LEDGER_RECONCILE_CRON: ${LEDGER_RECONCILE_CRON:-0 2 * * *}
      AUTH_CLEANUP_CRON: ${AUTH_CLEANUP_CRON:-0 3 * * *}
      # The signed license file (spec 0009), checked at worker start and daily at the cron below.
      LICENSE_FILE: ${LICENSE_FILE:-}
      LICENSE_CHECK_CRON: ${LICENSE_CHECK_CRON:-20 0 * * *}
    depends_on:
      migrate:
        condition: service_completed_successfully
    mem_limit: 512m

  web:
    image: ${SSD_REGISTRY:-ghcr.io/adiyab25}/ssdashboard-web:${SSD_VERSION}
    environment:
      API_INTERNAL_URL: http://api:3001
    depends_on:
      - api
    mem_limit: 512m
    restart: unless-stopped

  caddy:
    image: caddy:2.11-alpine
    # Only caddy may publish ports: the api trusts the X-Forwarded-For that Caddy sets (enforced by apps/api/test/compose-ports.spec.ts).
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Client language files, served at /locales/<code>.json. Add one by dropping the file in.
      - ../extensions/${CLIENT_ID}/locales:/srv/locales:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api
    mem_limit: 128m
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
