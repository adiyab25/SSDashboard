packages:
  - apps/*
  - packages/*
  - extensions/*

# One version of each shared dependency for the whole repo.
catalog:
  "@types/node": ^26.0.0
  eslint: ^9.39.5
  drizzle-kit: ^0.31.11
  drizzle-orm: ^0.45.4
  eslint-plugin-i18next: ^6.1.5
  eslint-plugin-jsdoc: 65.4.2
  eslint-plugin-react: 7.37.5
  eslint-plugin-tsdoc: 0.5.4
  eslint-plugin-unicorn: 65.0.1
  i18next: ^26.7.1
  react-i18next: ^17.1.12
  prettier: ^3.9.10
  pg: ^8.23.1
  "@types/pg": ^8.23.1
  turbo: ^2.11.10
  typescript: ^6.0.2
  typescript-eslint: ^8.72.1
  zod: ^4.6.7

# Install scripts run only for packages reviewed here.
allowBuilds:
  "@nestjs/core": false
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - react-i18next@17.1.12
